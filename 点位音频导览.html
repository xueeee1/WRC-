<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>声景标注台</title>
  <style>
    :root{--ink:#17221e;--muted:#718078;--paper:#f4f1e8;--card:#fffdf7;--line:#d9d7cc;--green:#264d3d;--mint:#d9eadf;--orange:#ee7c43;--shadow:0 18px 50px rgba(31,49,40,.12)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif} button,input,textarea{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}
    aside{background:var(--green);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--orange);display:grid;place-items:center;font-size:20px}.brand strong{font-size:19px;letter-spacing:.08em}.brand small{display:block;color:#b9cdc3;letter-spacing:.08em}
    .side-title{color:#b9cdc3;font-size:11px;text-transform:uppercase;letter-spacing:.18em;margin-bottom:8px}.markers{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:55vh}
    .marker-row{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;border-radius:11px;padding:8px 9px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:7px;text-align:left;font-size:12px}.marker-row.active{background:#fff;color:var(--ink);border-color:#fff}.marker-row .num{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--orange);font-weight:800;font-size:11px}.marker-row span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.marker-row .count{font-size:10px;opacity:.62}
    .empty-side{color:#b9cdc3;border:1px dashed rgba(255,255,255,.25);border-radius:14px;padding:18px;text-align:center}.side-foot{margin-top:auto;color:#a9c0b5;font-size:12px}.saved{display:flex;align-items:center;gap:7px}.saved:before{content:"";width:7px;height:7px;border-radius:50%;background:#71cc95;box-shadow:0 0 0 4px rgba(113,204,149,.12)}
    main{min-width:0;padding:24px 24px 38px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.headline h1{font-family:Georgia,"Songti SC",serif;font-size:28px;margin:0 0 3px}.headline p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:650;box-shadow:0 2px 0 rgba(20,30,25,.03)}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}.btn.danger{color:#ad3b2f}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}.canvas-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.canvas-card{padding:14px}.canvas-tools{padding:2px 4px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.mode-pill{background:var(--mint);color:var(--green);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:750}.stage{position:relative;border-radius:14px;overflow:hidden;min-height:560px;background:#e5e2d8;display:grid;place-items:center}.stage.has-image{min-height:0}.stage img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain}.welcome{text-align:center;padding:50px 25px;max-width:440px}.welcome-icon{width:78px;height:78px;border:1px dashed #9eaaa3;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;font-size:32px;background:rgba(255,255,255,.35)}.welcome h2{font-family:Georgia,"Songti SC",serif;margin:0 0 8px;font-size:24px}.welcome p{color:var(--muted);margin:0 0 18px}.hidden{display:none!important}
    .pin{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;padding:0;filter:drop-shadow(0 5px 7px rgba(0,0,0,.28));z-index:2}.pin-shape{width:38px;height:46px;background:var(--orange);clip-path:polygon(50% 100%,7% 48%,7% 27%,16% 10%,34% 1%,65% 1%,84% 10%,93% 27%,93% 48%);display:grid;place-items:start center;padding-top:8px;color:#fff;font-weight:800;font-size:13px}.pin.active .pin-shape{background:#fff;color:var(--green);outline:3px solid var(--green);outline-offset:-3px}.pin.playing .pin-shape{animation:pulse 1s infinite;background:#df553a}@keyframes pulse{50%{transform:translateY(-3px)}}
    .panel{padding:18px;position:sticky;top:20px}.panel-empty{min-height:270px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px}.panel h2{font-family:Georgia,"Songti SC",serif;margin:0;font-size:21px}.field{margin-top:15px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:650}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.textarea{resize:vertical;min-height:84px}.input:focus,.textarea:focus{border-color:#709184;box-shadow:0 0 0 3px rgba(80,125,106,.12)}
    .clips-head{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.clips-head strong{font-size:13px}.clip-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.clip{border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;gap:7px;align-items:center;background:#fff;transition:opacity .15s,box-shadow .15s,transform .15s}.clip.dragging{opacity:.42;box-shadow:0 10px 24px rgba(38,77,61,.2);transform:scale(.985)}.clip.drag-before{box-shadow:0 -4px 0 -1px var(--orange);transform:translateY(2px)}.clip.drag-after{box-shadow:0 4px 0 -1px var(--orange);transform:translateY(-2px)}.drag-handle{height:30px;display:grid;place-items:center;color:#8e9993;font-weight:800;user-select:none;touch-action:none;cursor:grab;border-radius:7px}.drag-handle:hover{background:var(--paper);color:var(--green)}.drag-handle:active{cursor:grabbing}.clip-index{width:24px;height:24px;border-radius:7px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-weight:800;font-size:11px}.clip-main{min-width:0}.clip-main strong,.clip-main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clip-main strong{font-size:12px}.clip-main span{font-size:11px;color:var(--muted)}.clip-actions{display:flex;gap:2px}.icon-btn{border:0;background:transparent;border-radius:7px;color:var(--muted);padding:4px 5px}.icon-btn:hover{background:var(--paper);color:var(--ink)}.icon-btn.bound{background:var(--mint);color:var(--green)}
    .add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.panel-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.hint{font-size:11px;color:var(--muted);margin-top:7px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#17221e;color:#fff;border-radius:99px;padding:10px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal-back{position:fixed;inset:0;background:rgba(17,28,23,.48);display:grid;place-items:center;padding:18px;z-index:10}.modal{background:var(--card);border-radius:18px;padding:22px;width:min(480px,100%);box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal h3{margin:0;font-family:Georgia,"Songti SC",serif;font-size:22px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
    .player-bar{margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.player-toggle{width:34px;height:34px;border:0;border-radius:50%;background:var(--green);color:#fff;font-weight:800}.timeline{width:100%;accent-color:var(--orange);cursor:pointer}.player-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:82px;text-align:right}.player-meta{grid-column:2/4;color:var(--muted);font-size:11px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .speech-bubble{position:absolute;z-index:5;transform:translate(-50%,-110%);pointer-events:none;filter:drop-shadow(0 8px 14px rgba(20,32,27,.24))}.bubble-body{position:relative;min-width:72px;height:42px;border-radius:18px 18px 18px 4px;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;border:2px solid var(--green)}.bubble-body:after{content:"";position:absolute;left:7px;bottom:-9px;border:6px solid transparent;border-top-color:var(--green);transform:rotate(18deg)}.wave{height:18px;display:flex;align-items:center;gap:3px}.wave i{display:block;width:3px;border-radius:3px;background:var(--orange);animation:voiceWave .72s ease-in-out infinite}.wave i:nth-child(1){height:7px}.wave i:nth-child(2){height:14px;animation-delay:.12s}.wave i:nth-child(3){height:18px;animation-delay:.24s}.wave i:nth-child(4){height:11px;animation-delay:.36s}.wave i:nth-child(5){height:6px;animation-delay:.48s}.speech-bubble.paused .wave i{animation-play-state:paused;opacity:.55}.speech-bubble.binding .bubble-body{border-style:dashed;background:#fff8e8}.speech-bubble.binding .wave i{animation:none}.bubble-label{font-size:11px;font-weight:800}@keyframes voiceWave{50%{transform:scaleY(.35);opacity:.55}}
    @media(max-width:1000px){.app{grid-template-columns:200px 1fr}.workspace{grid-template-columns:1fr}.panel{position:static}.stage{min-height:460px}}
    @media(max-width:720px){.app{display:block}aside{min-height:auto;padding:18px}.markers{max-height:180px}.side-foot{display:none}main{padding:18px 12px}.topbar{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.workspace{display:block}.panel{margin-top:14px}.stage{min-height:390px}.headline h1{font-size:24px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">♪</div><div><strong>声景标注台</strong><small>SOUND MAP STUDIO</small></div></div>
    <section><div class="side-title">点位列表</div><div id="markers" class="markers"></div></section>
    <div class="side-foot"><div id="saved" class="saved">更改会自动保存在此浏览器</div><p>图片与音频保存在本机，不会上传服务器。</p></div>
  </aside>
  <main>
    <header class="topbar">
      <div class="headline"><h1>交互式语音导览</h1><p>在图片上布置点位，为每个点位编排一段声音。</p></div>
      <div class="actions">
        <button class="btn" id="modeBtn">切换预览</button>
        <button class="btn" id="importBtn">导入备份</button>
        <button class="btn" id="exportBtn">导出完整备份</button>
        <button class="btn orange" id="imageBtn">导入背景图</button>
      </div>
    </header>
    <div class="workspace">
      <section class="canvas-card">
        <div class="canvas-tools"><span id="instruction">导入图片后，点击画面添加点位</span><span class="mode-pill" id="modePill">编辑模式</span></div>
        <div class="stage" id="stage">
          <div class="welcome" id="welcome"><div class="welcome-icon">⌁</div><h2>从一张图片开始</h2><p>支持 PNG、JPG、WEBP。导入后点击图片，即可放置带语音的点位。</p><button class="btn primary" id="welcomeBtn">选择背景图片</button></div>
          <img id="bg" class="hidden" alt="导览背景图" />
          <div id="pins"></div>
          <div id="bubbles"></div>
        </div>
        <div class="player-bar hidden" id="playerBar">
          <button class="player-toggle" id="playerToggle" aria-label="播放或暂停">▶</button>
          <input class="timeline" id="timeline" type="range" min="0" max="0" step="0.05" value="0" aria-label="播放进度" />
          <span class="player-time" id="playerTime">00:00 / 00:00</span>
          <span class="player-meta" id="playerMeta">准备播放</span>
        </div>
      </section>
      <section class="panel" id="panel"></section>
    </div>
  </main>
</div>
<input id="imageInput" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
<input id="audioInput" class="hidden" type="file" accept="audio/*" multiple />
<input id="backupInput" class="hidden" type="file" accept="application/json" />
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const state = {project:{version:1,imageKey:null,markers:[]},selected:null,mode:'edit',playing:null,playingClip:null,audio:null,cancelled:false,player:null,activeClip:null,bindingClip:null,mediaResolve:null,raf:null,ttsClock:null,seeking:false};
  let db, saveTimer, urlCache = new Map();
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
  async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('sound-map-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('assets');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  function store(mode,key,val){return new Promise((res,rej)=>{const tx=db.transaction('assets',mode),rq=mode==='readonly'?tx.objectStore('assets').get(key):tx.objectStore('assets').put(val,key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}
  async function assetURL(key){if(!key)return'';if(urlCache.has(key))return urlCache.get(key);const b=await store('readonly',key);if(!b)return'';const u=URL.createObjectURL(b);urlCache.set(key,u);return u}
  function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
  function dataURLToBlob(data){const [head,body]=data.split(','),type=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream',bin=atob(body),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}
  function persist(){clearTimeout(saveTimer);$('#saved').textContent='正在保存…';saveTimer=setTimeout(()=>{localStorage.setItem('soundMapProject',JSON.stringify(state.project));$('#saved').textContent='已自动保存';},250)}
  async function boot(){db=await openDB();try{const raw=localStorage.getItem('soundMapProject');if(raw)state.project=JSON.parse(raw)}catch{};if(state.project.markers?.length)state.selected=state.project.markers[0].id;await render()}
  async function render(){renderSidebar();renderPanel();renderPins();renderBubbles();renderPlayer();if(state.project.imageKey){$('#welcome').classList.add('hidden');$('#bg').classList.remove('hidden');$('#stage').classList.add('has-image');$('#bg').src=await assetURL(state.project.imageKey)}else{$('#welcome').classList.remove('hidden');$('#bg').classList.add('hidden');$('#stage').classList.remove('has-image')}}
  function renderSidebar(){const box=$('#markers'),ms=state.project.markers||[];box.innerHTML=ms.length?ms.map((m,i)=>`<button class="marker-row ${state.selected===m.id?'active':''}" data-select="${m.id}"><span class="num">${i+1}</span><span>${esc(m.name||'未命名点位')}</span><span class="count">${m.clips.length} 段</span></button>`).join(''):'<div class="empty-side">还没有点位<br>请先导入背景图</div>'}
  function renderPins(){const box=$('#pins');box.innerHTML=(state.project.markers||[]).map((m,i)=>`<button class="pin ${state.selected===m.id?'active':''} ${state.playing===m.id&&state.player&&!state.player.paused?'playing':''}" data-pin="${m.id}" style="left:${m.x}%;top:${m.y}%" aria-label="${esc(m.name)}"><span class="pin-shape">${i+1}</span></button>`).join('')}
  function renderBubbles(){const box=$('#bubbles'),m=state.project.markers.find(x=>x.id===state.selected)||state.project.markers.find(x=>x.id===state.playing),c=state.bindingClip?m?.clips.find(x=>x.id===state.bindingClip):state.activeClip;if(!c?.point){box.innerHTML='';return}const binding=state.bindingClip===c.id,paused=state.player?.paused;box.innerHTML=`<div class="speech-bubble ${binding?'binding':''} ${paused?'paused':''}" style="left:${c.point.x}%;top:${c.point.y}%"><div class="bubble-body">${binding?'<span class="bubble-label">气泡位置</span>':'<span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="bubble-label">播放中</span>'}</div></div>`}
  function fmt(sec){sec=Math.max(0,Number(sec)||0);const m=Math.floor(sec/60),s=Math.floor(sec%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
  function renderPlayer(){const bar=$('#playerBar'),p=state.player;if(!p){bar.classList.add('hidden');return}bar.classList.remove('hidden');$('#timeline').max=p.total||0;$('#timeline').value=Math.min(p.position||0,p.total||0);$('#playerTime').textContent=fmt(p.position)+' / '+fmt(p.total);$('#playerToggle').textContent=p.paused?'▶':'Ⅱ';const m=state.project.markers.find(x=>x.id===p.markerId),idx=p.clipIndex??0,c=m?.clips[idx];$('#playerMeta').textContent=c?`第 ${idx+1} 段 · ${c.type==='tts'?'文字朗读':c.name}`:'播放完成'}
  function renderPanel(){const p=$('#panel'),m=state.project.markers.find(x=>x.id===state.selected);if(!m){p.innerHTML='<div class="panel-empty"><div><div style="font-size:34px;margin-bottom:8px">◎</div><strong>选择一个点位</strong><br><span>点位的名称和音频会显示在这里</span></div></div>';return}p.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>点位 ${state.project.markers.indexOf(m)+1}</h2><button class="btn ${state.playing===m.id&&!state.player?.paused?'orange':'primary'}" data-play="${m.id}">${state.playing===m.id?(state.player?.paused?'继续':'暂停'):'试听'}</button></div>
    <div class="field"><label>点位名称</label><input class="input" id="markerName" value="${esc(m.name)}" placeholder="例如：入口大厅"></div>
    <div class="clips-head"><strong>播放清单 · ${m.clips.length} 段</strong><span class="hint" style="margin:0">拖动卡片调整顺序</span></div>
    <div class="clip-list">${m.clips.length?m.clips.map((c,i)=>`<div class="clip" data-clip="${c.id}"><span class="drag-handle" title="按住并拖动排序" aria-label="拖动排序">⠿</span><span class="clip-index">${i+1}</span><div class="clip-main"><strong>${c.type==='tts'?'文字朗读':'音频文件'}</strong><span>${esc(c.type==='tts'?c.text:c.name)}</span></div><div class="clip-actions"><button class="icon-btn ${c.point?'bound':''}" data-bind="${c.id}" title="${c.point?'重新绑定气泡位置':'绑定气泡位置'}">◉</button><button class="icon-btn" data-preview="${c.id}" title="${state.playingClip===c.id?'暂停':'预听'}">${state.playingClip===c.id?'Ⅱ':'▶'}</button><button class="icon-btn" data-up="${c.id}" title="上移">↑</button><button class="icon-btn" data-down="${c.id}" title="下移">↓</button><button class="icon-btn" data-remove="${c.id}" title="删除">×</button></div></div>`).join(''):'<div class="hint" style="text-align:center;padding:14px">暂无音频，请从下方添加</div>'}</div>
    <div class="add-grid"><button class="btn" id="addAudio">＋ 上传 MP3</button><button class="btn" id="addText">＋ 输入文字</button></div>
    <div class="hint">文字朗读使用当前浏览器的中文语音；不同设备的声音可能略有差异。</div>
    <div class="panel-bottom"><button class="btn danger" id="deleteMarker">删除点位</button><span class="hint">位置可在图片上拖动</span></div>`}
  function select(id){state.selected=id;render()}
  async function setImage(file){if(!file)return;const key=uid('image');await store('readwrite',key,file);state.project.imageKey=key;persist();await render();toast('背景图已保存')}
  function addMarker(x,y){const m={id:uid('marker'),name:'新点位 '+(state.project.markers.length+1),x:+x.toFixed(3),y:+y.toFixed(3),clips:[]};state.project.markers.push(m);state.selected=m.id;persist();render();toast('点位已添加')}
  function cancelMedia(){cancelAnimationFrame(state.raf);state.raf=null;if(state.audio){state.audio.pause();state.audio=null}speechSynthesis.cancel();state.ttsClock=null;const done=state.mediaResolve;state.mediaResolve=null;if(done)done()}
  function stop(){state.cancelled=true;if(state.player)state.player.token++;cancelMedia();state.playing=null;state.playingClip=null;state.player=null;state.activeClip=null;state.bindingClip=null;renderPins();renderPanel();renderBubbles();renderPlayer()}
  async function clipDuration(c){if(c.duration>0)return c.duration;if(c.type==='tts'){c.duration=Math.max(1.5,(c.text||'').replace(/\s/g,'').length/4.2);return c.duration}const u=await assetURL(c.key);c.duration=await new Promise(res=>{const a=new Audio(u);a.preload='metadata';a.onloadedmetadata=()=>res(Number.isFinite(a.duration)?a.duration:1);a.onerror=()=>res(1)});return c.duration}
  async function prepareTimeline(m){const durations=[];for(const c of m.clips)durations.push(await clipDuration(c));persist();return{durations,total:durations.reduce((a,b)=>a+b,0)}}
  function locate(p,pos){let sum=0;for(let i=0;i<p.durations.length;i++){const end=sum+p.durations[i];if(pos<end||i===p.durations.length-1)return{index:i,offset:Math.max(0,Math.min(p.durations[i],pos-sum)),prefix:sum};sum=end}return{index:0,offset:0,prefix:0}}
  function syncPosition(){const p=state.player;if(!p||p.paused)return;if(state.audio)p.position=p.prefix+Math.min(state.audio.currentTime,p.durations[p.clipIndex]);else if(state.ttsClock){const t=state.ttsClock;p.position=t.prefix+Math.min(t.duration,t.offset+(performance.now()-t.started)/1000)}renderPlayer()}
  function startTicker(){cancelAnimationFrame(state.raf);const tick=()=>{syncPosition();state.raf=requestAnimationFrame(tick)};state.raf=requestAnimationFrame(tick)}
  function playAudioPart(c,offset,token){return new Promise(async res=>{if(token!==state.player?.token)return res();const a=new Audio(await assetURL(c.key));state.audio=a;state.mediaResolve=res;a.preload='auto';a.currentTime=Math.max(0,Math.min(offset,(c.duration||1)-.02));a.onended=res;a.onerror=res;a.play().catch(()=>{toast('浏览器阻止播放，请再点一次');res()})})}
  function playTextPart(c,offset,duration,token){return new Promise(res=>{if(token!==state.player?.token)return res();const ratio=Math.min(1,offset/duration),start=Math.floor((c.text||'').length*ratio),text=(c.text||'').slice(start);if(!text)return res();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.95;state.mediaResolve=res;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
  async function startAt(id,position){const m=state.project.markers.find(x=>x.id===id);if(!m?.clips.length){toast('请先为此点位添加音频');return}let p=state.player;if(!p||p.markerId!==id){const t=await prepareTimeline(m);p=state.player={markerId:id,durations:t.durations,total:t.total,position:0,paused:true,token:0,clipIndex:0,prefix:0}}else cancelMedia();p.token++;const token=p.token,loc=locate(p,Math.max(0,Math.min(position,p.total)));if(position>=p.total){p.position=p.total;p.paused=true;p.clipIndex=p.durations.length-1;state.playing=id;state.activeClip=null;render();return}p.position=position;p.paused=false;p.clipIndex=loc.index;p.prefix=loc.prefix;state.playing=id;state.playingClip=null;state.cancelled=false;renderPins();renderPanel();renderPlayer();for(let i=loc.index;i<m.clips.length;i++){if(token!==p.token)return;const c=m.clips[i],duration=p.durations[i],prefix=p.durations.slice(0,i).reduce((a,b)=>a+b,0),offset=i===loc.index?loc.offset:0;p.clipIndex=i;p.prefix=prefix;p.position=prefix+offset;state.activeClip=c;state.ttsClock=c.type==='tts'?{prefix,offset,duration,started:performance.now()}:null;renderBubbles();renderPlayer();startTicker();c.type==='tts'?await playTextPart(c,offset,duration,token):await playAudioPart(c,offset,token);state.mediaResolve=null;if(token!==p.token)return;p.position=prefix+duration;state.audio=null;state.ttsClock=null}cancelAnimationFrame(state.raf);p.position=p.total;p.paused=true;state.playing=null;state.activeClip=null;renderPins();renderPanel();renderBubbles();renderPlayer()}
  async function playMarker(id){if(state.player?.markerId===id){if(state.player.paused)return startAt(id,state.player.position);syncPosition();state.player.paused=true;state.player.token++;cancelMedia();renderPins();renderPanel();renderBubbles();renderPlayer();return}stop();await startAt(id,0)}
  async function previewClip(id){if(state.playingClip===id){stop();return}const m=state.project.markers.find(x=>x.id===state.selected),c=m?.clips.find(x=>x.id===id);if(!c)return;stop();state.cancelled=false;state.playingClip=id;state.activeClip=c;renderPanel();renderBubbles();await new Promise(async res=>{state.mediaResolve=res;if(c.type==='tts'){const u=new SpeechSynthesisUtterance(c.text);u.lang='zh-CN';u.rate=.95;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}else{const a=new Audio(await assetURL(c.key));state.audio=a;a.onended=res;a.onerror=res;a.play().catch(res)}});if(state.playingClip===id){state.audio=null;state.mediaResolve=null;state.playingClip=null;state.activeClip=null;renderPanel();renderBubbles()}}
  function textModal(){const m=state.project.markers.find(x=>x.id===state.selected);if(!m)return;$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><h3>添加文字朗读</h3><div class="field"><label>朗读内容</label><textarea class="textarea" id="ttsText" placeholder="输入希望播放的讲解文字…"></textarea></div><div class="modal-actions"><button class="btn" id="cancelModal">取消</button><button class="btn primary" id="saveText">加入播放清单</button></div></div></div>`;$('#ttsText').focus();$('#cancelModal').onclick=()=>$('#modalRoot').innerHTML='';$('#saveText').onclick=()=>{const text=$('#ttsText').value.trim();if(!text)return toast('请先输入文字');m.clips.push({id:uid('clip'),type:'tts',text});$('#modalRoot').innerHTML='';persist();renderPanel()}}
  function moveClip(id,dir){const m=state.project.markers.find(x=>x.id===state.selected),i=m.clips.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=m.clips.length)return;[m.clips[i],m.clips[j]]=[m.clips[j],m.clips[i]];persist();renderPanel()}
  let draggedClipId=null,dropTargetId=null,dropAfter=false;
  function clearDragMarks(){document.querySelectorAll('.clip.drag-before,.clip.drag-after,.clip.dragging').forEach(el=>el.classList.remove('drag-before','drag-after','dragging'))}
  function reorderClip(fromId,toId,after){const m=state.project.markers.find(x=>x.id===state.selected);if(!m||fromId===toId)return;if(state.player)stop();const from=m.clips.findIndex(x=>x.id===fromId),to=m.clips.findIndex(x=>x.id===toId);if(from<0||to<0)return;const [item]=m.clips.splice(from,1);let at=to+(after?1:0);if(from<at)at--;m.clips.splice(at,0,item);persist();renderPanel();toast('播放顺序已更新')}
  $('#imageBtn').onclick=$('#welcomeBtn').onclick=()=>$('#imageInput').click();
  $('#imageInput').onchange=e=>setImage(e.target.files[0]);
  $('#modeBtn').onclick=()=>{state.mode=state.mode==='edit'?'preview':'edit';$('#modePill').textContent=state.mode==='edit'?'编辑模式':'预览模式';$('#modeBtn').textContent=state.mode==='edit'?'切换预览':'返回编辑';$('#instruction').textContent=state.mode==='edit'?'点击画面添加点位，拖动点位调整位置':'点击点位播放，再次点击暂停';toast(state.mode==='edit'?'已进入编辑模式':'已进入预览模式')};
  $('#stage').addEventListener('click',e=>{if(state.mode!=='edit'||!state.project.imageKey||e.target.closest('.pin'))return;const img=$('#bg'),r=img.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;addMarker((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});
  $('#markers').onclick=e=>{const b=e.target.closest('[data-select]');if(b)select(b.dataset.select)};
  $('#pins').onclick=e=>{const b=e.target.closest('[data-pin]');if(!b)return;e.stopPropagation();state.mode==='preview'?playMarker(b.dataset.pin):select(b.dataset.pin)};
  let drag=null;$('#pins').onpointerdown=e=>{const b=e.target.closest('[data-pin]');if(!b||state.mode!=='edit')return;drag={id:b.dataset.pin,pid:e.pointerId};b.setPointerCapture(e.pointerId)};$('#pins').onpointermove=e=>{if(!drag)return;const r=$('#bg').getBoundingClientRect(),m=state.project.markers.find(x=>x.id===drag.id);m.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));m.y=Math.max(2,Math.min(100,(e.clientY-r.top)/r.height*100));renderPins()};$('#pins').onpointerup=()=>{if(drag){drag=null;persist()}};
  $('#panel').oninput=e=>{if(e.target.id==='markerName'){const m=state.project.markers.find(x=>x.id===state.selected);m.name=e.target.value;persist();renderSidebar();renderPins()}};
  $('#panel').onpointerdown=e=>{const handle=e.target.closest('.drag-handle'),card=handle?.closest('[data-clip]');if(!card)return;e.preventDefault();draggedClipId=card.dataset.clip;dropTargetId=null;$('#panel').setPointerCapture(e.pointerId);card.classList.add('dragging')};
  $('#panel').onpointermove=e=>{if(!draggedClipId)return;e.preventDefault();const card=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-clip]');document.querySelectorAll('.clip.drag-before,.clip.drag-after').forEach(el=>el.classList.remove('drag-before','drag-after'));if(!card||card.dataset.clip===draggedClipId){dropTargetId=null;return}const r=card.getBoundingClientRect();dropAfter=e.clientY>r.top+r.height/2;dropTargetId=card.dataset.clip;card.classList.add(dropAfter?'drag-after':'drag-before')};
  function endCardDrag(e){if(!draggedClipId)return;const from=draggedClipId,to=dropTargetId,after=dropAfter;draggedClipId=dropTargetId=null;clearDragMarks();try{$('#panel').releasePointerCapture(e.pointerId)}catch{}if(to)reorderClip(from,to,after)}
  $('#panel').onpointerup=endCardDrag;$('#panel').onpointercancel=endCardDrag;
  $('#panel').onclick=e=>{const m=state.project.markers.find(x=>x.id===state.selected);if(e.target.closest('[data-play]'))return playMarker(m.id);if(e.target.id==='addAudio')return $('#audioInput').click();if(e.target.id==='addText')return textModal();if(e.target.id==='deleteMarker'){stop();state.project.markers=state.project.markers.filter(x=>x.id!==m.id);state.selected=state.project.markers[0]?.id||null;persist();render()}const preview=e.target.closest('[data-preview]'),up=e.target.closest('[data-up]'),down=e.target.closest('[data-down]'),del=e.target.closest('[data-remove]');if(preview)return previewClip(preview.dataset.preview);if(up)moveClip(up.dataset.up,-1);if(down)moveClip(down.dataset.down,1);if(del){m.clips=m.clips.filter(x=>x.id!==del.dataset.remove);persist();renderPanel()}};
  $('#audioInput').onchange=async e=>{const m=state.project.markers.find(x=>x.id===state.selected);if(!m)return;for(const f of e.target.files){const key=uid('audio');await store('readwrite',key,f);m.clips.push({id:uid('clip'),type:'audio',key,name:f.name})}e.target.value='';persist();renderPanel();renderSidebar();toast('音频已加入播放清单')};
  $('#exportBtn').onclick=async()=>{const btn=$('#exportBtn'),keys=[state.project.imageKey,...state.project.markers.flatMap(m=>m.clips.filter(c=>c.type==='audio').map(c=>c.key))].filter(Boolean),assets={};btn.disabled=true;btn.textContent='正在打包…';try{for(const key of [...new Set(keys)]){const blob=await store('readonly',key);if(blob)assets[key]={type:blob.type,data:await blobToDataURL(blob)}}const pack={format:'sound-map-studio-backup',version:2,exportedAt:new Date().toISOString(),project:state.project,assets},blob=new Blob([JSON.stringify(pack)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='声景标注台-完整备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('完整备份已下载')}catch(err){toast('备份失败：浏览器存储空间不足')}finally{btn.disabled=false;btn.textContent='导出完整备份'}};
  $('#importBtn').onclick=()=>$('#backupInput').click();
  $('#backupInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file||!confirm('导入备份会替换当前页面中的项目，是否继续？'))return;try{const pack=JSON.parse(await file.text());if(pack.format!=='sound-map-studio-backup'||!pack.project||!pack.assets)throw Error('invalid');stop();for(const [key,item] of Object.entries(pack.assets))await store('readwrite',key,dataURLToBlob(item.data));for(const u of urlCache.values())URL.revokeObjectURL(u);urlCache.clear();state.project=pack.project;state.selected=state.project.markers[0]?.id||null;localStorage.setItem('soundMapProject',JSON.stringify(state.project));await render();toast('备份已完整恢复')}catch(err){toast('无法导入：请选择本工具导出的完整备份')}};
  window.addEventListener('beforeunload',()=>{localStorage.setItem('soundMapProject',JSON.stringify(state.project));stop()});
  boot().catch(()=>toast('浏览器存储不可用，请使用现代浏览器打开'));
})();
